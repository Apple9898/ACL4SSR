name: Update Crypto Gist

on:
  schedule:
    # 每小时检查一次（UTC），订阅节点变化后最多 1 小时内 gist 跟进更新
    # 内容无变化时脚本会自动跳过，不会产生无意义提交
    - cron: "0 * * * *"
  workflow_dispatch: # 仓库 Actions 页面可手动触发
  push:
    branches: [main]
    paths:
      - "scripts/build_and_update.py"

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build config and update gist
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python scripts/build_and_update.py
          cp mihomo_crypto_latest.yaml mihomo_crypto_v3.yaml

      - name: Commit updated config to repo (for jsDelivr CDN)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mihomo_crypto_v3.yaml
          git diff --cached --quiet || git commit -m "chore: auto-update mihomo_crypto_v3.yaml (config refresh)"
          git push origin main

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/Apple9898/ACL4SSR@main/mihomo_crypto_v3.yaml" || true

      - name: Upload config artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: mihomo_crypto_latest
          path: mihomo_crypto_latest.yaml
          if-no-files-found: error